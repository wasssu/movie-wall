name: Update TMDB

on:
  workflow_dispatch:

  schedule:
  - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests

      - name: Fetch TMDB
        run: python scripts/fetch_tmdb.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/tmdb.json

          git diff --cached --quiet || (
            git commit -m "Update TMDB data"
            git push
          )
